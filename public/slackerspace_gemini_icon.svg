<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- 부드러운 드롭 섀도우 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 외곽 둥근 사각 컨테이너 & 테두리 -->
  <rect width="180" height="180" rx="38" fill="#f8fafc"/>
  <rect width="176" height="176" x="2" y="2" rx="36" fill="none" stroke="#e2e8f0" stroke-width="1.8"/>

  <!-- 정중앙(90, 90)으로 스케일업하여 배치한 순수 심볼마크 -->
  <g transform="translate(90, 90) scale(1.3)" filter="url(#softShadow)">
    <!-- 1. 우주/공간을 도는 궤도 점선 링 -->
    <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#64748b" stroke-width="3.5" stroke-dasharray="3.5 5" transform="rotate(-15)"/>

    <!-- 2. 초승달처럼 낮잠 자는 주황색 고양이 (Slacker의 여유) -->
    <!-- 몸통 (초승달 실루엣) -->
    <path d="M -26 -16 C -38 4, -20 28, 6 28 C 24 28, 34 16, 32 6 C 26 14, 14 18, 0 16 C -18 14, -26 -2, -26 -16 Z" fill="#f97316"/>
    <!-- 고양이 귀 -->
    <polygon points="-24,-12 -28,-22 -18,-15" fill="#f97316"/>
    <polygon points="-16,-14 -12,-24 -8,-14" fill="#f97316"/>
    <!-- 자는 눈 (평온한 미소 곡선) -->
    <path d="M -20 -4 Q -16 -1 -12 -4" fill="none" stroke="#7c2d12" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- 3. 마감을 향해 질주하는 로켓 만년필 (Space & Team Project) -->
    <g transform="translate(18, -14) rotate(42)">
      <!-- 로켓/펜촉 팁 -->
      <path d="M 0 -14 L 6 0 L -6 0 Z" fill="#6366f1"/>
      <!-- 몸통 -->
      <rect x="-6" y="0" width="12" height="10" rx="2" fill="#4f46e5"/>
      <!-- 추진 불꽃 포인트 -->
      <polygon points="-4,10 0,16 4,10" fill="#f43f5e"/>
    </g>
  </g>
</svg>
