# 개발용 로컬 PostgreSQL. docker compose -f server/docker-compose.yml up -d
# 접속 주소: postgres://postgres:postgres@localhost:5432/talju  (운영 비밀번호로 쓰지 말 것)
#
# 오피스 편집(선택): docker compose -f server/docker-compose.yml --profile office up -d
#   OnlyOffice 문서 서버를 127.0.0.1:8080에 띄운다(메모리 2~4GB). server/.env의 ONLYOFFICE_JWT_SECRET을 그대로 쓴다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talju
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - talju-db:/var/lib/postgresql/data
  onlyoffice:
    image: onlyoffice/documentserver
    profiles: ["office"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}  # server/.env의 값(비어 있으면 서명이 맞지 않아 편집기가 열리지 않음)
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - talju-office-data:/var/www/onlyoffice/Data
      - talju-office-cache:/var/lib/onlyoffice
    restart: unless-stopped
volumes:
  talju-db:
  talju-office-data:
  talju-office-cache:
