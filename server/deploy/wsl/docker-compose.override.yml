# 학교 PC(WSL2 우분투) 운영용 덧붙임. server/ 폴더에서:
#   docker compose -f docker-compose.yml -f deploy/wsl/docker-compose.override.yml --profile office up -d
# 프로젝트 이름은 첫 파일 위치(server)로 정해지므로 pnpm run backup(기본 compose 파일만 사용)도 같은 컨테이너를 찾는다.
# POSTGRES_PASSWORD는 server/.env에 넣는다. 새 볼륨을 처음 만들 때만 적용된다.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?server/.env에 POSTGRES_PASSWORD를 설정하세요}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talju"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
